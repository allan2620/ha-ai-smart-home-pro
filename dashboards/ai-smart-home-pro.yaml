        card_mod:
          style: |
            ha-card {
              background: #243449 !important;
              border-radius: 22px;
              overflow: hidden;
            }
      - type: entities
        title: IVT – Driftsstatus
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hp_compressor
            name: Kompressor
          - entity: binary_sensor.hp_switch_valve_1
            name: Omskifterventil
          - entity: binary_sensor.hp_pump_cold_circuit
            name: Brinepumpe
          - entity: binary_sensor.hp_pump_heat_circuit
            name: Varmekredspumpe
          - entity: sensor.hp_add_heat_status
            name: Tilskudsvarme
          - entity: sensor.hp_power_consumption
            name: Elforbrug
      - type: history-graph
        title: IVT – Fremløb og retur (24 timer)
        hours_to_show: 24
        entities:
          - entity: sensor.hp_heat_carrier_forwrd
            name: Fremløb
          - entity: sensor.hp_heat_carrier_return
            name: Retur
          - entity: sensor.hp_heating_setpoint
            name: Setpunkt
      - type: history-graph
        title: IVT – Kompressor (24 timer)
        hours_to_show: 24
        entities:
          - entity: binary_sensor.hp_compressor
            name: Kompressor
  - title: Historik
